<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engagement OS — 운영 모듈 · 설정 센터 시뮬레이터</title>
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<style>
/* ─── AE 콘솔 실측 토큰 (ae-demo.thinkingdata.io, 2026-08-03 측정) ─── */
:root{
  --pri:#3C50FF; --pri-focus:#3040CC; --pri-soft:#E8EAFF;
  --ink:#212121; --ink-2:#333333; --ink-3:#8A8F9E; --ink-4:#B9BECF;
  --line:#EDEEF2; --line-2:#DCDFE8; --page:#FFFFFF; --panel:#FFFFFF; --sub:#F7F8FA;
  --red:#E5484D; --green:#12A150; --amber:#C77700; --purple:#7C5CE0;
  --sw-off:rgba(185,190,207,.5);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"TA-Roboto","pingfang sc",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","system-ui","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --acc:var(--pri); --acc-soft:var(--pri-soft);
}
@media (prefers-color-scheme:dark){
 :root{--ink:#EEF0F5;--ink-2:#D3D7E0;--ink-3:#8A8F9E;--ink-4:#5C6172;
  --line:#242732;--line-2:#333744;--page:#12141A;--panel:#171A21;--sub:#1C1F27;
  --pri:#7A88FF;--pri-soft:#20243F;--sw-off:rgba(120,126,148,.5);}
}
:root[data-theme="dark"]{--ink:#EEF0F5;--ink-2:#D3D7E0;--ink-3:#8A8F9E;--ink-4:#5C6172;
 --line:#242732;--line-2:#333744;--page:#12141A;--panel:#171A21;--sub:#1C1F27;
 --pri:#7A88FF;--pri-soft:#20243F;--sw-off:rgba(120,126,148,.5);}
:root[data-theme="light"]{--ink:#212121;--ink-2:#333333;--ink-3:#8A8F9E;--ink-4:#B9BECF;
 --line:#EDEEF2;--line-2:#DCDFE8;--page:#FFFFFF;--panel:#FFFFFF;--sub:#F7F8FA;
 --pri:#3C50FF;--pri-soft:#E8EAFF;--sw-off:rgba(185,190,207,.5);}
body[data-sec="config"]{}
html{background:var(--page);}
body{margin:0;background:var(--page);color:var(--ink-2);font-family:var(--sans);font-size:14px;line-height:1.6;}
.hidden{display:none !important;}
button{font-family:var(--sans);}

/* ─── 상단 내비 56px ─── */
.topnav{height:56px;display:flex;align-items:center;gap:0;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30;}
.grid9{width:16px;height:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-right:12px;flex:none;}
.grid9 i{background:var(--ink-4);border-radius:1px;display:block;}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--pri);margin-right:22px;white-space:nowrap;}
.brand .sp{width:19px;height:19px;border-radius:5px;background:linear-gradient(135deg,#6E5CF0,#3C50FF);flex:none;}
.brand .ch{color:var(--ink-4);font-weight:400;font-size:13px;}
.nav{display:flex;align-items:center;gap:2px;}
.nav button{background:none;border:none;font-size:14px;color:var(--ink-2);padding:5px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;}
.nav button:hover{color:var(--pri);}
.nav button[aria-current="true"]{background:var(--pri-soft);color:var(--pri);}
.nav button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px;}
.nav .car{font-size:9px;color:var(--ink-4);}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px;}
.tico{width:17px;height:17px;color:var(--ink-3);font-size:15px;line-height:1;cursor:default;}
.projchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;}
.projchip .av{width:22px;height:22px;border-radius:50%;background:#4DB6A0;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;}
.projchip select{border:none;background:none;font-family:var(--sans);font-size:13px;color:var(--ink-2);cursor:pointer;padding:0;}
.projchip select:focus{outline:none;}

/* ─── 셸 ─── */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:calc(100vh - 56px);}
@media (max-width:1180px){.shell{grid-template-columns:260px minmax(0,1fr);} .rail{grid-column:1/-1;position:static;}}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr);} .side{display:none;}}
.side{border-right:1px solid var(--line);padding:20px 12px;background:var(--panel);}
.side h1{font-size:16px;font-weight:500;color:var(--ink);margin:0 0 14px;padding:0 8px;}
.side button{display:flex;align-items:center;gap:10px;width:100%;height:40px;text-align:left;font-size:14px;color:var(--ink-2);background:none;border:none;border-radius:8px;padding:0 12px 0 8px;cursor:pointer;}
.side button:hover{background:var(--sub);}
.side button[aria-current="true"]{background:var(--pri-soft);}
.side button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px;}
.side .ic{width:16px;text-align:center;flex:none;font-size:13px;color:var(--ink-3);}
.side button[aria-current="true"] .ic{color:var(--pri);}
main{padding:20px 22px 60px;min-width:0;background:var(--page);}

/* ─── 페이지 헤더 ─── */
.phead{display:flex;align-items:baseline;gap:28px;margin-bottom:18px;flex-wrap:wrap;}
.phead h2{font-size:24px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em;}
.ptabs{display:flex;gap:26px;align-items:baseline;}
.ptabs button{background:none;border:none;font-size:14.5px;color:var(--ink-3);padding:0 0 6px;cursor:pointer;border-bottom:4px solid transparent;}
.ptabs button[aria-selected="true"]{color:var(--ink-2);font-weight:500;border-bottom-color:var(--pri);}
.ptabs button:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.pact{margin-left:auto;display:flex;gap:9px;align-items:center;}
.srch{display:flex;align-items:center;gap:6px;width:220px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font-size:13px;color:var(--ink-3);background:var(--panel);}
.srch input{border:none;background:none;font-family:var(--sans);font-size:13px;color:var(--ink-2);width:100%;}
.srch input:focus{outline:none;}

/* ─── 버튼 (실측: h32 r8 p5-16) ─── */
.btn{height:32px;border-radius:8px;padding:5px 16px;font-size:14px;font-weight:400;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:none;}
.btn-pri{background:var(--pri);color:#fff;}
.btn-pri:hover{filter:brightness(1.08);}
.btn-def{background:var(--panel);color:var(--ink-2);border:1px solid var(--line-2);}
.btn-def:hover{color:var(--pri);border-color:var(--pri);}
.btn-txt{background:none;color:var(--ink-2);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}

/* ─── 테이블 (실측: 헤더 h48 14/500 #212121) ─── */
.tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
.tblscroll{overflow-x:auto;}
table.at{width:100%;border-collapse:collapse;font-size:14px;min-width:660px;}
table.at th{height:48px;text-align:left;font-size:14px;font-weight:500;color:var(--ink);padding:0 8px 0 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.at th .flt{color:var(--ink-4);font-size:10px;margin-left:5px;}
table.at td{padding:12px 8px 12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2);}
table.at tr:last-child td{border-bottom:none;}
table.at tr:hover td{background:var(--sub);}
.lnk{color:var(--pri);cursor:pointer;}
.sub2{font-size:12px;color:var(--ink-3);margin-top:2px;}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:52px 0;}

/* 상태 카운터 */
.counters{display:flex;gap:34px;align-items:flex-start;padding:14px 18px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--panel);flex-wrap:wrap;}
.counters .grp{display:flex;gap:34px;}
.counters .divx{width:1px;background:var(--line);align-self:stretch;}
.cnt .l{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;}
.cnt .l i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.cnt .v{font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3;}
.tbl.attached{border-radius:0 0 8px 8px;}

/* 배지 */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:4px;padding:2px 6px;}
.bdg-c{background:#FFF3E4;color:#B26A00;}
.bdg-g{background:#E6F6EC;color:#12803F;}
.dotst{display:inline-flex;align-items:center;gap:5px;font-size:13px;}
.dotst i{width:6px;height:6px;border-radius:50%;background:var(--green);}
.prog{height:3px;border-radius:2px;background:var(--line);margin-top:5px;width:96px;overflow:hidden;}
.prog span{display:block;height:100%;background:var(--green);}
.ico-act{display:flex;gap:12px;color:var(--ink-3);font-size:14px;}
.ico-act span{cursor:pointer;}
.ico-act span:hover{color:var(--pri);}

/* 아코디언(메시지 푸시) */
.acc{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--panel);}
.acch{display:flex;align-items:center;gap:9px;padding:14px 16px;}
.acch .tri{color:var(--ink-3);font-size:10px;cursor:pointer;transition:transform .15s;}
.acch .tri.open{transform:rotate(90deg);}
.acch .nm{font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;}
.acch .ct{font-size:13px;color:var(--ink-3);font-weight:400;}
.acch .rt{margin-left:auto;display:flex;gap:9px;align-items:center;}
.accb{border-top:1px solid var(--line);padding:12px 16px;}

/* 폼 (실측: label 14/500, input h32 r8 p0-8) */
.fl{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin:16px 0 6px;}
.fl .rq{color:var(--red);margin-right:3px;}
.fl .op{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:5px;}
input[type=text],select{width:100%;box-sizing:border-box;height:32px;font-family:var(--sans);font-size:14px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 8px;}
textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:14px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;resize:vertical;min-height:64px;}
input::placeholder,textarea::placeholder{color:var(--ink-4);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri-focus);}
.fh{font-size:12px;color:var(--ink-3);margin-top:5px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rd{display:flex;flex-wrap:wrap;gap:20px;margin-top:6px;}
.rd label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;}
.rd input{accent-color:var(--pri);}

/* 스위치 (실측 32x16 r16) */
.tg{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500;margin:16px 0 0;color:var(--ink-2);}
.tg input{position:absolute;opacity:0;width:0;height:0;}
.tg .sw{width:32px;height:16px;border-radius:16px;background:var(--sw-off);position:relative;transition:background .15s;flex:none;}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s;}
.tg input:checked + .sw{background:var(--pri);}
.tg input:checked + .sw::after{transform:translateX(16px);}
.tg input:focus-visible + .sw{outline:2px solid var(--pri);outline-offset:2px;}
.swmini{width:32px;height:16px;border-radius:16px;background:var(--pri);position:relative;display:inline-block;}
.swmini::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;}

/* 퍼널 다이어그램 */
.fdia{display:grid;grid-template-columns:210px 1fr;gap:20px;border:1px solid var(--line);background:var(--sub);border-radius:8px;padding:16px;margin-top:12px;}
@media (max-width:700px){.fdia{grid-template-columns:1fr;}}
.fdia .dl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:10px;}
.fstep{margin-bottom:10px;}
.fstep .t{font-size:12px;color:var(--ink-2);}
.fstep .bar{height:7px;border-radius:4px;background:var(--line-2);margin-top:4px;}
.fstep.a .bar{background:var(--pri);}
.fstep .n{font-size:11px;color:var(--pri);font-weight:600;font-variant-numeric:tabular-nums;}
.fnote{font-size:12px;color:var(--ink-3);line-height:1.6;}

/* 파라미터 테이블 */
table.pt{width:100%;border-collapse:separate;border-spacing:0 0;font-size:13px;margin-top:8px;}
table.pt th{text-align:left;font-size:13px;font-weight:400;color:var(--ink-2);padding:0 6px 8px;white-space:nowrap;}
table.pt th .rq{color:var(--red);margin-right:2px;}
table.pt td{padding:0 6px 10px;vertical-align:top;}
table.pt input,table.pt select{height:32px;font-size:13px;}
.drag{color:var(--ink-4);font-size:13px;padding-top:8px;}
.delx{color:var(--ink-4);font-size:15px;padding-top:6px;cursor:pointer;}

/* 드로어 992px */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;justify-content:flex-end;}
.drawer{background:var(--panel);width:100%;max-width:992px;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.14);}
.dh{padding:20px 24px 14px;}
.dh .row{display:flex;align-items:flex-start;}
.dh h3{font-size:16px;font-weight:500;color:var(--ink);margin:0;}
.dh .ms{font-size:13px;color:var(--ink-3);margin-top:3px;}
.dh .ms a{color:var(--pri);text-decoration:none;}
.dh .x{margin-left:auto;background:none;border:none;font-size:17px;color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 4px;}
.dh .x:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.db{padding:0 24px 16px;flex:1;overflow-y:auto;}
.df{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 18px;}

/* 우측 단말 */
.rail{border-left:1px solid var(--line);padding:16px 14px;background:var(--panel);position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow-y:auto;}
.railh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;}
.railh .dt{width:7px;height:7px;border-radius:50%;background:var(--green);}
.appsw{display:flex;gap:5px;margin-bottom:10px;}
.appsw button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:500;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;}
.appsw button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink);}
.appsw button:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.phone{background:#0B0D12;border-radius:26px;padding:6px;}
.screen{position:relative;background:#F2F4F8;border-radius:21px;height:412px;overflow:hidden;display:flex;flex-direction:column;}
.statusbar{display:flex;justify-content:space-between;padding:6px 13px 2px;font-size:9.5px;color:#5C6474;font-weight:600;flex:none;}
.lock{position:absolute;inset:0;background:linear-gradient(170deg,#1A2233,#2C3850 60%,#3A4866);display:flex;flex-direction:column;padding:10px;z-index:5;}
.lock .clk{color:#fff;text-align:center;margin:20px 0 14px;}
.lock .clk .h{font-size:36px;font-weight:300;line-height:1;}
.lock .clk .d{font-size:10px;opacity:.72;margin-top:4px;}
.notif{background:rgba(255,255,255,.95);border-radius:11px;padding:9px 10px;margin-bottom:7px;cursor:pointer;border:none;text-align:left;width:100%;font-family:var(--sans);display:block;box-sizing:border-box;}
.notif:hover{background:#fff;}
.notif:focus-visible{outline:2px solid #93A7FF;outline-offset:2px;}
.notif .ap{display:flex;align-items:center;gap:5px;font-size:9px;color:#6C7383;font-weight:600;margin-bottom:2px;}
.notif .ic{width:11px;height:11px;border-radius:3px;background:var(--pri);display:inline-block;}
.notif .ti{display:block;font-size:11.5px;font-weight:700;color:#161A24;line-height:1.32;}
.notif .bo{display:block;font-size:10.5px;color:#4C5364;line-height:1.4;margin-top:2px;}
.lock .hx{margin-top:auto;text-align:center;font-size:9.5px;color:rgba(255,255,255,.55);padding-bottom:4px;}
.appbar{background:#fff;padding:8px 12px;border-bottom:1px solid #E7EAF1;flex:none;}
.appbar .nm{font-size:12.5px;font-weight:700;color:#161A24;}
.appbar .sb{font-size:9.5px;color:#8A91A2;}
.content{flex:1;overflow-y:auto;padding:10px;}
.tabbar{display:flex;background:#fff;border-top:1px solid #E7EAF1;flex:none;}
.tabbar button{flex:1;background:none;border:none;padding:6px 0 8px;font-size:9px;color:#969DAE;cursor:pointer;font-weight:600;}
.tabbar button[aria-pressed="true"]{color:var(--pri);}
.tabbar .ti{display:block;font-size:13px;margin-bottom:1px;}
.bnr{border-radius:9px;padding:12px 11px;margin-bottom:9px;color:#fff;}
.bnr .t{font-size:12.5px;font-weight:700;line-height:1.3;}
.bnr .s{font-size:10px;opacity:.9;margin-top:2px;}
.gc{background:#fff;border-radius:9px;padding:9px 10px;margin-bottom:7px;border:1px solid #EAEDF3;}
.gc .t{font-size:11.5px;font-weight:600;color:#161A24;}
.gc .s{font-size:10px;color:#7B8293;margin-top:2px;}
.pr{font-size:11.5px;font-weight:700;color:#161A24;}
.pr s{color:#A8AEBC;font-weight:400;font-size:10px;margin-right:4px;}
.dsc{display:inline-block;background:#FFE8E3;color:#B03A16;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:4px;}
.emx{text-align:center;color:#9FA5B4;font-size:10.5px;padding:26px 10px;line-height:1.7;}
.mail{background:#fff;border-radius:9px;padding:9px 10px;margin-bottom:7px;border:1px solid #EAEDF3;border-left:3px solid var(--pri);}
.mail .t{font-size:11.5px;font-weight:700;color:#161A24;}
.mail .b{font-size:10px;color:#5F6677;margin-top:2px;line-height:1.45;}
.mail .rw{font-size:9.5px;color:var(--pri);font-weight:700;margin-top:4px;}
.mail .via{font-size:8.5px;color:#A8AEBC;font-family:var(--mono);margin-top:4px;}
.ovl{position:absolute;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:center;justify-content:center;z-index:6;padding:18px;}
.pop{background:#fff;border-radius:13px;padding:15px 14px;width:100%;text-align:center;}
.pop .t{font-size:13px;font-weight:700;color:#161A24;}
.pop .b{font-size:10.5px;color:#535A6B;margin:5px 0 12px;line-height:1.5;}
.pop button{width:100%;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:8px;font-size:11.5px;font-weight:700;cursor:pointer;}
.strip{position:absolute;top:28px;left:8px;right:8px;background:var(--pri);color:#fff;border-radius:9px;padding:8px 10px;z-index:6;}
.strip .t{font-size:11px;font-weight:700;}
.strip .b{font-size:9.5px;opacity:.9;}
.strip button{position:absolute;top:5px;right:7px;background:none;border:none;color:rgba(255,255,255,.85);font-size:13px;cursor:pointer;line-height:1;padding:2px 3px;}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;}
.met{background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:8px 9px;}
.met .l{font-size:10px;color:var(--ink-3);}
.met .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--ink);}
.met.on{border-color:var(--pri);background:var(--pri-soft);}
.met.on .v{color:var(--pri);}
.logbox{font-family:var(--mono);font-size:11px;line-height:1.7;max-height:120px;overflow-y:auto;background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:9px;}
.logbox div{color:var(--ink-2);}
.logbox .t{color:var(--ink-4);}

"nav.channel":["채널","메시지를 <b>어디로 보낼지</b> 정하는 통로입니다. 채널 없이는 어떤 발송도 할 수 없습니다.","Engage 도입 시 가장 먼저. 채널은 한 번 만들면 계속 재사용합니다.","채널 종류에 따라 다름 — Webhook은 수신 서버 구현, FCM은 SDK 토큰 리포트만.","목적(복귀 유도/보상 지급/공지)에 맞는 채널 종류를 먼저 결정합니다."],
"nav.task":["운영 작업","실제로 <b>누구에게 무엇을 언제</b> 보낼지 정하는 발송 단위입니다.","캠페인을 실행할 때마다. 채널이 '배관'이면 작업은 '이번에 보낼 물건'입니다.","트리거 방식이면 이벤트 리포트가 선행돼야 합니다.","대상 세그먼트·문구·발송 시각·성공 지표를 정의합니다."],
"nav.fatigue":["피로도 제어","한 유저가 받는 푸시 총량을 제한해 <b>알림 차단·앱 삭제를 방지</b>합니다.","운영자가 2명 이상이거나 캠페인이 동시에 여러 개 돌 때 필수.","없음 — 플랫폼 설정만으로 동작합니다.","일/주 한도를 정합니다. 태스크가 아닌 <b>유저 단위</b>로 센다는 점이 핵심입니다."],
"nav.approver":["승인자","발송 전 결재 단계를 넣어 <b>오발송을 구조적으로 차단</b>합니다.","전 유저 대상 발송이나 보상 지급처럼 되돌릴 수 없는 캠페인이 있을 때.","없음.","결재 라인을 정합니다. 도입 초기엔 끄고 시작해 속도를 확보하는 편이 낫습니다."],
"nav.allow":["화이트리스트","지정한 유저에게만 보내는 <b>리허설 발송</b>입니다. 테스트 발송과 달리 실제 발송 플로우를 그대로 탑니다.","본 발송 직전 최종 점검. 세그먼트·문구·딥링크가 실제로 동작하는지 확인할 때.","QA 계정의 식별자(계정 ID/토큰)를 확보해 전달합니다.","QA 대상자 명단을 등록하고, 리허설 결과를 확인한 뒤 본 발송을 승인합니다."],
"nav.analytics":["분석 설정","신규·활성·결제 이벤트를 지정해 <b>워크스페이스 집계의 기준</b>을 만듭니다.","Engage 도입 초기 1회. 이후 이벤트 체계가 바뀔 때만.","해당 이벤트가 실제로 수집되고 있는지 확인·보완합니다.","게임이면 register/login/purchase_success, 이커머스면 signup/session_start/order_complete로 매핑합니다."],
"nav.l10n":["현지화","유저의 언어 속성에 맞춰 <b>버전별 문구를 자동 선택</b>해 발송합니다.","다국가 서비스일 때. 필리핀·말레이시아처럼 언어가 갈리는 시장에 특히 중요합니다.","유저 언어 속성이 수집되고 있어야 합니다.","언어별 문구를 작성합니다. 번역 품질이 성과에 직결되므로 현지 검수를 권장합니다."],
"nav.cparam":["클라이언트 파라미터","발송 <b>시점의 실시간 상태</b>를 조건으로 추가 검증합니다. 타겟 사용자가 '자격 심사'라면 이건 '현장 확인'입니다.","인앱 메시지에서 '지금 이 화면·이 레벨인 유저에게만' 같은 조건이 필요할 때.","<code>setClientParam()</code>으로 레벨·스테이지 등 상태값을 SDK에 전달합니다.","어떤 상태를 조건으로 쓸지 정의하고 클라이언트팀과 파라미터명을 합의합니다."],
"nav.ctable":["설정 테이블 관리","컨텐츠 템플릿의 <b>드롭다운 선택지</b>를 미리 등록해 오타와 누락을 막습니다.","보상 코드·메일 종류처럼 정해진 값 중에서만 골라야 할 때.","코드 체계를 제공합니다(기존 기획 데이터의 코드를 그대로 쓰는 것이 원칙).","선택지 목록을 등록·관리합니다. 운영자가 값을 직접 타이핑하지 않게 되어 사고가 줄어듭니다."],
/* 채널 종류 */
"chan.webhook":["Webhook 채널","AE가 <b>자사 서버로 JSON을 POST</b>하고, 실제 전달은 서버가 합니다. 전송 수단에 제한이 없습니다.","인게임 메일·쿠폰 지급·SMS 연동처럼 자체 발송 로직이 필요할 때.","수신 엔드포인트 구현 — 서명 검증·멱등성·큐 적재·receipt 회신. 약 4 man-day.","전달물 스키마(필드 표)를 확정해 개발에 넘깁니다. 이 표가 곧 개발 명세입니다."],
"chan.push":["메시지 푸시","OS 알림창에 뜨는 푸시입니다. 세 채널 중 <b>유일하게 앱 밖 유저에게 닿습니다</b>.","이탈 유저 복귀 유도. 리텐션이 목표라면 최우선 채널입니다.","Firebase/APNs 준비 + 토큰 리포트 + 클릭 트래킹. 서버 개발은 없습니다.","발송 시간대·빈도·문구를 설계합니다. 알림 권한 허용률이 도달 상한이 됩니다."],
"chan.client":["클라이언트 채널","SDK가 받아 <b>앱 UI로 직접 렌더링</b>합니다. 앱을 실행 중인 유저에게만 닿습니다.","온보딩 안내, 이탈 방지 팝업, 상품 제안 등 앱 안에서의 개입.","메시지 타입별 렌더링 코드 구현이 필수입니다. 서버 개발은 없습니다.","어떤 화면·어떤 순간에 띄울지 시나리오를 설계합니다."],
"chan.third":["서드파티 플랫폼","위챗 구독 메시지·틱톡 게임 카드 등 <b>외부 플랫폼</b> 연동입니다.","해당 플랫폼에 서비스를 운영할 때만.","플랫폼별 SDK·계정 연동이 필요합니다.","해당 시장 진출 계획이 있을 때 검토합니다. 국내 SMS·알림톡은 여기 없고 Webhook으로 처리합니다."],
"prov.FCM":["FCM","구글의 푸시 인프라. <b>무료·무제한</b>이며 Android 표준입니다.","Android 유저에게 푸시를 보낼 때. 글로벌 서비스의 기본값.","Firebase 프로젝트 + 서비스 계정 키 발급, SDK 토큰 리포트.","키를 발급받아 등록합니다. 발송 비용이 없어 예산 부담이 없습니다."],
"prov.Aurora Mobile":["Aurora Mobile (极光推送)","중국 내 Android에는 구글 서비스가 없어 <b>FCM이 동작하지 않습니다</b>. 그 대안입니다.","중국 시장에 Android 앱을 서비스할 때만.","JPush SDK 연동 + Registration ID 리포트.","중국 진출 계획이 없으면 무시해도 됩니다. AppKey/MasterSecret 발급이 필요합니다."],
"prov.APNs":["APNs","애플의 푸시 서비스. iOS 푸시는 <b>반드시 여기를 거칩니다</b>.","iOS 앱에 푸시를 보낼 때.","p8 인증키(만료 없음) 권장. iOS SDK 푸시 자동 수집을 켜면 도달·클릭이 자동 집계됩니다.","Apple Developer 계정에서 키·TeamID·BundleID를 확보합니다."],
/* 공통 필드 */
"f.name":["채널 이름","운영자가 작업을 만들 때 <b>고르는 식별용 이름</b>입니다.","채널 생성 시 1회.","없음.","용도가 드러나게 짓습니다(예: <code>ingame-mail</code>). 나중에 개발용·플랫폼별 채널이 늘어납니다."],
"f.url":["URL","AE가 POST를 보낼 <b>자사 서버 주소</b>입니다. 플랫폼이 주는 값이 아닙니다.","Webhook 채널 생성 시. 서버 배포가 끝난 뒤 등록합니다.","엔드포인트를 만들고 배포한 뒤 <b>전체 주소를 회신</b>합니다. 경로는 자사 컨벤션대로 자유롭게.","서버팀에 '값을 알려달라'가 아니라 <b>개발 요청</b>을 해야 합니다. 만들어야 생기는 값입니다."],
"f.sendid":["전송 ID","<b>누구에게 보낼지</b> 식별하는 유저 속성입니다. payload의 <code>push_id</code>에 실립니다.","채널 생성 시. 채널 종류마다 적절한 속성이 다릅니다.","푸시면 토큰을, Webhook이면 서버가 조회 가능한 계정 ID를 <b>유저 속성으로 리포트</b>해야 합니다.","드롭다운이 비어 있으면 SDK 작업이 아직 안 된 것입니다. 개발 일정을 먼저 확인하세요."],
"f.verify":["채널 검증","시크릿 토큰으로 요청에 <b>서명</b>을 붙여, 위조·변조된 요청을 서버가 걸러낼 수 있게 합니다.","운영 채널은 항상 켜는 것을 권장합니다.","서명 검증 로직 구현. 토큰은 코드에 하드코딩하지 말고 시크릿 저장소로 주입합니다.","<code>openssl rand -hex 32</code>로 토큰을 만들어 안전한 경로로 서버팀에 전달합니다."],
"f.crypt":["암호화 방식","일반은 <b>키+본문</b>으로 서명해 변조를 막고, 고급은 <b>키+타임스탬프+난수</b>로 탈취 후 재사용까지 막습니다.","기본값(일반)으로 시작하고, 보안 요건이 높으면 고급으로.","선택한 방식에 맞춰 검증 로직을 구현합니다. 방식이 다르면 서명이 맞지 않습니다.","서버팀과 합의 후 선택합니다. 임의로 바꾸면 발송이 전부 실패합니다."],
"f.funnel":["도달 퍼널 설정","발송이 <b>어디까지 갔는지</b> 단계별로 집계합니다. 켜지 않으면 '몇 건 보냈다'만 남습니다.","항상 켜세요. 단계별 감소폭이 곧 개선 지점입니다.","4단계(클릭)는 앱이 이벤트를 올려야 채워집니다. 이벤트명을 채널 설정과 일치시켜야 합니다.","1→2 급감은 토큰·정책 문제, 2→3은 토큰 노후, 3→4는 문구 문제로 해석합니다."],
"f.clickev":["푸시 클릭 이벤트명","4단계만 커스텀입니다. <b>앱이 실제로 올리는 이벤트 이름</b>을 적어야 연결됩니다.","도달 퍼널을 켤 때 함께.","알림 클릭 핸들러에서 이벤트를 리포트합니다. 이름은 사업팀과 사전 합의.","코드·채널 설정·트래킹 플랜 <b>세 곳의 이름이 모두 일치</b>해야 합니다. 오타 하나로 0건이 됩니다."],
"f.tpl":["컨텐츠 템플릿","운영자의 <b>입력 폼</b>이자 서버가 받을 <b>JSON 구조</b>입니다. 필드명이 곧 payload 키가 됩니다.","Webhook·클라이언트 채널 생성 시. 여기서 정한 필드가 개발 명세가 됩니다.","정의된 필드명 그대로 읽도록 구현합니다. 자동 매핑이 아니라 <b>이름 약속</b>입니다.","태스크마다 바뀌는 값만 필드로 만듭니다. 보상 코드는 기존 기획 데이터 체계를 그대로 씁니다."],
"f.custom":["커스텀 파라미터","화면에 보이지 않고 <b>시스템끼리 주고받는 값</b>입니다. 유저 속성을 자동으로 실어 보냅니다.","다중 서버 환경에서 서버 ID를 함께 보내는 등, 발송 대상을 명확히 특정해야 할 때.","해당 값을 읽어 라우팅·분기에 사용합니다.","어떤 부가 정보가 있어야 서버가 정확히 처리할 수 있는지 개발팀과 확인합니다."],
"f.pass":["패스스루 파라미터","알림에는 보이지 않고 <b>앱이 코드로 읽는</b> 부가 데이터입니다.","캠페인 식별, 특정 오브젝트 강조, 쿠폰 자동 적용 등. 화면 이동은 「방식」이 담당합니다.","값을 읽어 처리하는 코드가 없으면 무시됩니다. 키 이름을 사업팀과 합의합니다.","딥링크만 필요하면 「방식」으로 충분합니다. 처음엔 비워두고 시작해도 됩니다."],
"f.pkey":["서버 개인 키","AE가 구글 FCM API를 호출할 <b>발송 권한</b>입니다.","FCM 채널 생성 시 1회. 만료가 없어 재발급이 드뭅니다.","Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성.","앱 전체에 푸시를 보낼 수 있는 권한이므로 <b>파일을 메신저로 돌리지 마세요</b>."],
"f.mtype":["메시지 타입","앱 코드가 <b>이 값으로 분기</b>해 렌더링 방식을 결정합니다. <code>if (type=='popup')</code>","클라이언트 채널 생성 시. 팝업·배너·마퀴 등 표현 방식마다 값을 나눕니다.","타입별 렌더링 UI를 구현해야 합니다. 구현되지 않은 타입은 아무것도 표시되지 않습니다.","어떤 표현이 필요한지 기획하고 클라이언트팀과 타입 이름을 합의합니다."],
/* 태스크 */
"t.new":["작업 생성","실제 발송 단위를 만듭니다. 채널이 '배관'이면 작업은 <b>이번에 보낼 물건</b>입니다.","캠페인을 실행할 때마다.","트리거 발송이면 기준 이벤트가 수집되고 있어야 합니다.","목적 한 문장(누구에게·언제·무엇을·어떤 행동 유도)을 먼저 쓰고 시작하세요."],
"t.chan":["채널 선택","같은 문구라도 <b>채널에 따라 닿는 유저가 완전히 다릅니다</b>.","작업 생성 시 최초 선택. 나중에 바꾸면 입력 폼이 달라집니다.","각 채널이 요구하는 사전 작업이 다릅니다.","앱 밖 유저면 푸시, 앱 안이면 클라이언트, 보상 지급이면 Webhook으로 고릅니다."],
"t.lang":["기본 언어 / ＋","언어별 버전을 만들면 AE가 <b>유저의 언어 속성에 맞춰</b> 자동 선택합니다.","다국가 서비스일 때.","유저 언어 속성 수집이 선행돼야 합니다.","＋로 언어를 추가하고 각 버전을 작성합니다. 현지 검수를 거치는 편이 성과가 좋습니다."],
"t.attr":["유저 속성 삽입","문구에 닉네임·등급 같은 값을 넣으면 <b>유저마다 다른 문장</b>으로 치환돼 발송됩니다.","개인화가 성과에 영향을 주는 캠페인. 복귀 유도에 특히 효과적입니다.","해당 속성이 수집되고 있어야 합니다. 값이 비면 어색해지므로 기본값 정책을 정합니다.","치환값이 비었을 때의 대체 문구까지 함께 준비합니다."],

function hl(k){return HELP[k]?'<i class="hm" tabindex="0" role="button" data-h="'+k+'" aria-label="설명 보기">i</i>':'';}
(function(){
 var tip=document.createElement("div");tip.id="helptip";document.body.appendChild(tip);
 var LB=[["why","왜 필요"],["when","언제"],["dev","개발팀"],["biz","사업팀"]];
 function show(el){
  var h=HELP[el.getAttribute("data-h")];if(!h)return;
  tip.innerHTML='<h4>'+h[0]+'</h4>'+LB.map(function(l,i){
    return '<div class="hrow"><div class="hk '+l[0]+'">'+l[1]+'</div><div class="hv">'+h[i+1]+'</div></div>';}).join("");
  var r=el.getBoundingClientRect();tip.classList.add("on");
  var w=340,left=r.left+r.width/2-w/2;
  left=Math.max(10,Math.min(left,window.innerWidth-w-10));
  var th=tip.offsetHeight,top=r.bottom+9;
  if(top+th>window.innerHeight-8)top=Math.max(8,r.top-th-9);
  tip.style.left=left+"px";tip.style.top=top+"px";
 }
 function hide(){tip.classList.remove("on");}
 document.addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest("[data-h]");if(t)show(t);});
 document.addEventListener("mouseout",function(e){if(e.target.closest&&e.target.closest("[data-h]"))hide();});
 document.addEventListener("focusin",function(e){var t=e.target.closest&&e.target.closest("[data-h]");if(t)show(t);});
 document.addEventListener("focusout",hide);
 document.addEventListener("keydown",function(e){if(e.key==="Escape")hide();});
 window.addEventListener("scroll",hide,true);
})();

 if(S.log.length>40)S.log.pop();
 var el=document.getElementById("logbox");
 el.innerHTML=S.log.length?S.log.map(l=>'<div><span class="t">'+l.t+'</span> <span class="'+l.c+'">'+esc(l.m)+'</span></div>').join(""):'<div class="em">동작 기록</div>';}

  if(S.fatigueOn&&S.sends>=2){mets();log("피로도 제어로 차단 — 일일 2회 한도 초과","no");return;}
  S.sends++;S.funnel[1]++;S.funnel[2]++;log("FCM 전송 성공 → OS 알림창 표시","ok");
  S.notifs.unshift({t:t,b:b,mode:(document.querySelector('input[name=ntm]:checked')||{value:"open"}).value,app:S.app});

 else{S.funnel[0]++;

var TOUR={on:false,list:null,i:0};
function toggleTourMenu(e){e.stopPropagation();document.getElementById("tourMenu").classList.toggle("hidden");}
document.addEventListener("click",function(){var m=document.getElementById("tourMenu");if(m)m.classList.add("hidden");});
function startTour(k){
 document.getElementById("tourMenu").classList.add("hidden");
 TOUR.on=true;TOUR.list=TOURS[k];TOUR.i=0;
 if(!document.getElementById("spot")){
  ["tourblock","spot"].forEach(function(id){var d=document.createElement("div");d.id=id;document.body.appendChild(d);});
  var c=document.createElement("div");c.id="tourcard";document.body.appendChild(c);
 }
 ["tourblock","spot","tourcard"].forEach(function(id){document.getElementById(id).style.display="block";});
 showStep();
}
function endTour(){TOUR.on=false;closeDrawer();
 ["tourblock","spot","tourcard"].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display="none";});}
function tourNext(){if(TOUR.i<TOUR.list.length-1){TOUR.i++;showStep();}else endTour();}
function tourPrev(){if(TOUR.i>0){TOUR.i--;showStep();}}
function rectOf(st){
 if(st.center)return null;
 var el=null;
 if(st.sel)el=document.querySelector(st.sel);
 else if(st.h){var m=document.querySelector('[data-h="'+st.h+'"]');
  if(m){el=m.closest("label")||m.closest("button")||m.parentElement;}}
 if(!el)return null;
 el.scrollIntoView({block:"center",behavior:"instant"});
 var r=el.getBoundingClientRect();
 if(el.tagName==="LABEL"&&el.nextElementSibling){
  var n=el.nextElementSibling.getBoundingClientRect();
  if(n.height>0&&n.top-r.bottom<40)r={top:r.top,left:Math.min(r.left,n.left),bottom:n.bottom,
   right:Math.max(r.right,n.right),width:Math.max(r.right,n.right)-Math.min(r.left,n.left),height:n.bottom-r.top};
 }
 return r;
}
function showStep(){
 var st=TOUR.list[TOUR.i];
 if(st.seed&&!S.channels.webhook.length&&!S.channels.push.length&&!S.channels.client.length){
  S.channels.webhook.push({name:"ingame-mail",url:"https://api.example.com/engage/webhook",sendId:"유저 속성 · #account_id"});
  log("가이드: 데모 채널을 자동 생성했습니다","hi");}
 if(st.go){S.sec=st.go[0];document.body.setAttribute("data-sec",S.sec);
  document.getElementById("sideTitle").textContent=S.sec==="engage"?"운영 설정":"설정 센터";
  S.nav=st.go[1];paintTop();paintSide();}
 if(st.ct)S.chTab=st.ct;
 S.composing=!!st.compose;
 if(st.go||st.ct||st.compose!==undefined)paintMain();
 if(st.drawer){if(!S.drawer||S.drawer.k!==st.drawer)openDrawer(st.drawer);}
 else if(S.drawer&&!st.drawer)closeDrawer();
 setTimeout(function(){paintStep(st);},60);
}
function paintStep(st){
 var r=rectOf(st),sp=document.getElementById("spot"),cd=document.getElementById("tourcard");
 var pad=7;
 if(r){sp.style.opacity=1;sp.style.top=(r.top-pad)+"px";sp.style.left=(r.left-pad)+"px";
  sp.style.width=(r.width+pad*2)+"px";sp.style.height=(r.height+pad*2)+"px";}
 else{sp.style.opacity=0;sp.style.top="50%";sp.style.left="50%";sp.style.width="0px";sp.style.height="0px";}
 var pct=Math.round((TOUR.i+1)/TOUR.list.length*100);
 cd.innerHTML='<div class="tstep">STEP '+(TOUR.i+1)+' / '+TOUR.list.length+'</div>'+
  '<h4>'+st.t+'</h4><div class="tdesc">'+st.d+'</div>'+
  '<div class="trow"><div class="tk dev">개발팀</div><div class="tv">'+st.dev+'</div></div>'+
  '<div class="trow"><div class="tk biz">사업팀</div><div class="tv">'+st.biz+'</div></div>'+
  '<div class="tfoot"><div class="prog"><span style="width:'+pct+'%"></span></div>'+
  '<div class="tnum">'+(TOUR.i+1)+'/'+TOUR.list.length+'</div><div class="tbtns">'+
  '<button class="btn btn-txt" onclick="endTour()">종료</button>'+
  (TOUR.i>0?'<button class="btn btn-def" onclick="tourPrev()">이전</button>':'')+
  '<button class="btn btn-pri" onclick="tourNext()">'+(TOUR.i===TOUR.list.length-1?"완료":"다음 ⏎")+'</button></div></div>';
 var w=392,ch=cd.offsetHeight,L,T;
 if(r){L=r.left+r.width/2-w/2;T=r.bottom+14;
  if(T+ch>window.innerHeight-10)T=r.top-ch-14;
  if(T<10){T=Math.max(10,(window.innerHeight-ch)/2);L=r.right+16;
   if(L+w>window.innerWidth-10)L=r.left-w-16;}
 }else{L=(window.innerWidth-w)/2;T=(window.innerHeight-ch)/2;}
 cd.style.left=Math.max(10,Math.min(L,window.innerWidth-w-10))+"px";
 cd.style.top=Math.max(10,Math.min(T,window.innerHeight-ch-10))+"px";
}
document.addEventListener("keydown",function(e){
 if(!TOUR.on)return;
 if(e.key==="Enter"){e.preventDefault();tourNext();}
 else if(e.key==="Escape"){e.preventDefault();endTour();}
 else if(e.key==="ArrowLeft")tourPrev();
 else if(e.key==="ArrowRight")tourNext();
});
window.addEventListener("resize",function(){if(TOUR.on)paintStep(TOUR.list[TOUR.i]);});

paintTop();setSection("engage");log("콘솔 로드 — 실측 디자인 토큰 적용","hi");phone();
</script>
