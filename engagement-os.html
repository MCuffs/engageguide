<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engagement OS — 운영 모듈 · 설정 센터 시뮬레이터</title>
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<style>
/* ─── AE 콘솔 실측 토큰 (ae-demo.thinkingdata.io, 2026-08-03 측정) ─── */
:root{
  --pri:#3C50FF; --pri-focus:#3040CC; --pri-soft:#E8EAFF;
  --ink:#212121; --ink-2:#333333; --ink-3:#8A8F9E; --ink-4:#B9BECF;
  --line:#EDEEF2; --line-2:#DCDFE8; --page:#FFFFFF; --panel:#FFFFFF; --sub:#F7F8FA;
  --red:#E5484D; --green:#12A150; --amber:#C77700; --purple:#7C5CE0;
  --sw-off:rgba(185,190,207,.5);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"TA-Roboto","pingfang sc",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","system-ui","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sans-title:"TA-NotoSansKR","Noto Sans KR","TA-Roboto",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --acc:var(--pri); --acc-soft:var(--pri-soft);
}
@media (prefers-color-scheme:dark){
 :root{--ink:#EEF0F5;--ink-2:#D3D7E0;--ink-3:#8A8F9E;--ink-4:#5C6172;
  --line:#242732;--line-2:#333744;--page:#12141A;--panel:#171A21;--sub:#1C1F27;
  --pri:#7A88FF;--pri-soft:#20243F;--sw-off:rgba(120,126,148,.5);}
}
:root[data-theme="dark"]{--ink:#EEF0F5;--ink-2:#D3D7E0;--ink-3:#8A8F9E;--ink-4:#5C6172;
 --line:#242732;--line-2:#333744;--page:#12141A;--panel:#171A21;--sub:#1C1F27;
 --pri:#7A88FF;--pri-soft:#20243F;--sw-off:rgba(120,126,148,.5);}
:root[data-theme="light"]{--ink:#212121;--ink-2:#333333;--ink-3:#8A8F9E;--ink-4:#B9BECF;
 --line:#EDEEF2;--line-2:#DCDFE8;--page:#FFFFFF;--panel:#FFFFFF;--sub:#F7F8FA;
 --pri:#3C50FF;--pri-soft:#E8EAFF;--sw-off:rgba(185,190,207,.5);}
body[data-sec="config"]{}
html{background:var(--page);}
body{margin:0;background:var(--page);color:var(--ink-2);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden;}
.hidden{display:none !important;}
button{font-family:var(--sans);}

/* ─── 상단 내비 56px ─── */
.topnav{height:56px;display:flex;align-items:center;gap:0;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30;}
.grid9{width:16px;height:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-right:12px;flex:none;}
.grid9 i{background:var(--ink-4);border-radius:1px;display:block;}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--pri);margin-right:22px;white-space:nowrap;}
.brand .sp{width:19px;height:19px;border-radius:5px;background:linear-gradient(135deg,#6E5CF0,#3C50FF);flex:none;}
.brand .ch{color:var(--ink-4);font-weight:400;font-size:13px;}
.nav{display:flex;align-items:center;gap:2px;}
.nav button{background:none;border:none;font-size:14px;line-height:56px;height:56px;color:var(--ink-2);padding:0 12px;margin-right:12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;}
.nav button:hover{color:var(--pri);}
.nav button[aria-current="true"],.nav button.is-open{background:var(--pri-soft);color:var(--pri);}
.nav button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px;}
.nav .car{font-size:9px;color:var(--ink-4);}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px;}
.tico{width:17px;height:17px;color:var(--ink-3);font-size:15px;line-height:1;cursor:default;}
.projchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;}
.projchip .av{width:22px;height:22px;border-radius:50%;background:#4DB6A0;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;}
.projchip select{border:none;background:none;font-family:var(--sans);font-size:13px;color:var(--ink-2);cursor:pointer;padding:0;}
.projchip select:focus{outline:none;}
@media(max-width:900px){
 .topnav{max-width:100vw;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.topnav::-webkit-scrollbar{display:none}
 .topright{margin-left:0}.topright>.tico,.topright>.projchip{display:none}.brand{margin-right:8px}.nav button{padding:5px 8px}
}

/* ─── 셸 ─── */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:calc(100vh - 56px);}
@media (max-width:1180px){.shell{grid-template-columns:260px minmax(0,1fr);} .rail{grid-column:1/-1;position:static;}}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr);} .side{display:none;}}
.side{border-right:1px solid var(--line);padding:0 12px 20px;background:var(--panel);}
body[data-sec="experiment"] .side,body[data-nav="feature"] .side{display:none;}
body[data-sec="experiment"] .shell,body[data-nav="feature"] .shell{grid-template-columns:minmax(0,1fr) 300px;}
@media (max-width:1180px){body[data-sec="experiment"] .shell,body[data-nav="feature"] .shell{grid-template-columns:minmax(0,1fr);}}
.side h1{font-size:14px;font-weight:400;line-height:25px;color:var(--ink-2);margin:0;padding:14px 0 14px 12px;}
.side button{display:flex;align-items:center;gap:10px;width:100%;height:40px;text-align:left;font-size:14px;color:var(--ink-2);background:none;border:none;border-radius:8px;padding:0 12px 0 8px;cursor:pointer;}
.side button:hover{background:var(--sub);}
.side button[aria-current="true"]{background:var(--pri-soft);}
.side button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px;}
.side .ic{width:16px;text-align:center;flex:none;font-size:13px;color:var(--ink-3);}
.side button[aria-current="true"] .ic{color:var(--pri);}
main{padding:20px 22px 60px;min-width:0;background:var(--page);}

/* ─── 페이지 헤더 ─── */
.phead{display:flex;align-items:baseline;gap:28px;margin-bottom:18px;flex-wrap:wrap;}
.arch{display:inline-flex;align-items:center;gap:5px;margin-left:12px;font-size:13px;color:var(--ink-3);cursor:pointer;background:none;border:none;align-self:center;}
.arch:hover{color:var(--pri);}
.phead h2{font-family:var(--sans-title);font-size:24px;font-weight:500;line-height:36px;color:var(--ink);margin:0;letter-spacing:-.01em;}
.ptabs{display:flex;gap:26px;align-items:baseline;}
.ptabs button{background:none;border:none;font-size:14px;color:#7E7F80;padding:0 0 6px;cursor:pointer;border-bottom:4px solid transparent;}
.ptabs button[aria-selected="true"]{color:var(--ink-2);font-weight:500;border-bottom-color:var(--pri);}
.ptabs button:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.pact{margin-left:auto;display:flex;gap:9px;align-items:center;}
.srch{display:flex;align-items:center;gap:6px;width:216px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font-size:14px;color:var(--ink-3);background:var(--panel);}
.srch input{border:none;background:none;font-family:var(--sans);font-size:14px;color:var(--ink-2);width:100%;}
.srch input:focus{outline:none;}

/* ─── 버튼 (실측: h32 r8 p5-16) ─── */
.btn{height:32px;border-radius:8px;padding:5px 16px;font-size:14px;font-weight:400;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:none;}
.btn-pri{background:var(--pri);color:#fff;}
.btn-pri:hover{filter:brightness(1.08);}
.btn-def{background:var(--panel);color:var(--ink-2);border:1px solid var(--line-2);}
.btn-def:hover{color:var(--pri);border-color:var(--pri);}
.btn-txt{background:none;color:var(--ink-2);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}

/* ─── 테이블 (실측: 헤더 h48 14/500 #212121) ─── */
.tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
.tblscroll{overflow-x:auto;}
table.at{width:100%;border-collapse:collapse;font-size:14px;min-width:660px;}
table.at th{height:48px;text-align:left;font-size:14px;font-weight:500;color:var(--ink);padding:0 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.at th .flt{color:var(--ink-4);font-size:10px;margin-left:5px;}
table.at td{padding:10px 16px;line-height:18px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2);}
table.at tr:last-child td{border-bottom:none;}
table.at tr:hover td{background:var(--sub);}
.lnk{color:var(--pri);cursor:pointer;}
.sub2{font-size:12px;color:var(--ink-3);margin-top:2px;}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:52px 0;}

/* 상태 카운터 */
.counters{display:flex;gap:34px;align-items:flex-start;padding:14px 18px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--panel);flex-wrap:wrap;}
.counters .grp{display:flex;gap:34px;}
.counters .divx{width:1px;background:var(--line);align-self:stretch;}
.cnt .l{font-size:12px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:5px;}
.cnt .l i{width:6px;height:6px;border-radius:50%;display:inline-block;}
.cnt .v{font-size:20px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:24px;}
.tbl.attached{border-radius:0 0 8px 8px;}

/* 배지 */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:4px;padding:2px 6px;}
.bdg-c{background:#FFF3E4;color:#B26A00;}
.bdg-g{background:#E6F6EC;color:#12803F;}
.dotst{display:inline-flex;align-items:center;gap:5px;font-size:13px;}
.dotst i{width:6px;height:6px;border-radius:50%;background:var(--green);}
.prog{height:3px;border-radius:2px;background:var(--line);margin-top:5px;width:96px;overflow:hidden;}
.prog span{display:block;height:100%;background:var(--green);}
.ico-act{display:flex;gap:12px;color:var(--ink-3);font-size:14px;}
.ico-act span{cursor:pointer;}
.ico-act span:hover{color:var(--pri);}

/* ─── Atlas 실험 ─── */
.atlas-counters{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:var(--panel);}
.atlas-count{padding:14px 16px;border-right:1px solid var(--line);}
.atlas-count:last-child{border-right:0}.atlas-count span{display:block;font-size:12px;color:var(--ink-3)}.atlas-count b{font-size:21px;color:var(--ink)}
.atlas-status{display:inline-flex;align-items:center;gap:5px}.atlas-status i{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
table.at tr.scenario-asset-row td{background:#F5F6FF;border-bottom-color:#DDE0FF;}
table.at tr.scenario-asset-row td:first-child{box-shadow:inset 3px 0 0 var(--pri);}
.asset-main{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600}.asset-main .bdg{background:#E9ECFF;color:#4457D8;font-weight:600;}
.atlas-layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px}.atlas-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px 20px;margin-bottom:14px}
.atlas-card h3{font-size:17px;margin:0 0 15px;color:var(--ink)}.atlas-kv{display:grid;grid-template-columns:150px 1fr;gap:12px 18px;font-size:13px}.atlas-kv dt{color:var(--ink-3)}.atlas-kv dd{margin:0;color:var(--ink)}
.atlas-anchor{position:sticky;top:76px;border-left:1px solid var(--line);padding-left:16px}.atlas-anchor button{display:block;border:0;background:none;color:var(--ink-3);padding:6px 0;cursor:pointer}.atlas-anchor button.on{color:var(--pri);font-weight:600}
.traffic-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--sub)}.traffic-head{display:flex;justify-content:space-between;align-items:center}.traffic-bar{height:10px;background:var(--line-2);border-radius:8px;overflow:hidden;margin:10px 0}.traffic-bar span{display:block;height:100%;background:var(--pri)}
.exp-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exp-group{border:1px solid var(--line);border-radius:8px;padding:14px}.exp-group.control{border-color:#B9C0FF;background:#F7F8FF}.exp-group h4{margin:0 0 10px;color:var(--ink)}.exp-group .alloc{font-size:22px;font-weight:700;color:var(--pri)}
.atlas-editbar{display:flex;align-items:center;gap:12px;margin:-20px -22px 18px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:56px;z-index:8}.atlas-editbar .name{font-size:17px;font-weight:700;color:var(--ink)}.atlas-editbar .actions{margin-left:auto;display:flex;gap:8px}
.atlas-slider{display:flex;align-items:center;gap:14px}.atlas-slider .track{height:8px;background:var(--line-2);border-radius:6px;flex:1;overflow:hidden}.atlas-slider .track span{display:block;width:50%;height:100%;background:var(--pri)}.atlas-slider b{font-size:18px;color:var(--pri)}
.metric-role{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric-role div{border:1px solid var(--line);border-radius:8px;padding:12px}.metric-role b{display:block;color:var(--ink);margin-bottom:3px}.metric-role span{font-size:12px;color:var(--ink-3)}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.report-kpi{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel)}.report-kpi span{font-size:12px;color:var(--ink-3)}.report-kpi b{display:block;font-size:24px;color:var(--ink);margin-top:4px}.report-kpi em{font-style:normal;font-size:12px;color:var(--green)}
.trend{height:180px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(to bottom,transparent 32%,var(--line) 33%,transparent 34%,transparent 65%,var(--line) 66%,transparent 67%);position:relative;overflow:hidden}.trend svg{width:100%;height:100%}
.exp-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exp-type{border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer}.exp-type.on{border-color:var(--pri);background:var(--pri-soft)}.exp-type b{display:block;color:var(--ink)}.exp-type span{font-size:12px;color:var(--ink-3)}
.atlas-card input:not([type]),.drawer input:not([type]),.atlas-editbar input:not([type]){width:100%;height:32px;font-family:var(--sans);font-size:14px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 8px}
@media(max-width:900px){.atlas-counters{grid-template-columns:repeat(3,1fr)}.atlas-count:nth-child(3){border-right:0}.atlas-layout{grid-template-columns:1fr}.atlas-anchor{display:none}.report-grid,.metric-role{grid-template-columns:1fr 1fr}}

/* 아코디언(메시지 푸시) */
.acc{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--panel);}
.acch{display:flex;align-items:center;gap:9px;padding:14px 16px;}
.acch .tri{color:var(--ink-3);font-size:10px;cursor:pointer;transition:transform .15s;}
.acch .tri.open{transform:rotate(90deg);}
.acch .nm{font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;}
.acch .ct{font-size:13px;color:var(--ink-3);font-weight:400;}
.acch .rt{margin-left:auto;display:flex;gap:9px;align-items:center;}
.accb{border-top:1px solid var(--line);padding:12px 16px;}

/* 폼 (실측: label 14/500, input h32 r8 p0-8) */
.fl{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin:16px 0 6px;}
.fl .rq{color:var(--red);margin-right:3px;}
.fl .op{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:5px;}
input[type=text],select{width:100%;box-sizing:border-box;height:32px;font-family:var(--sans);font-size:14px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 8px;}
textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:14px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;resize:vertical;min-height:64px;}
input::placeholder,textarea::placeholder{color:var(--ink-4);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri-focus);box-shadow:0 0 0 3px #C8D0FF;}
.fh{font-size:12px;color:var(--ink-3);margin-top:5px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rd{display:flex;flex-wrap:wrap;gap:20px;margin-top:6px;}
.rd label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;}
.rd input{accent-color:var(--pri);}

/* 스위치 (실측 32x16 r16) */
.tg{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500;margin:16px 0 0;color:var(--ink-2);}
.tg input{position:absolute;opacity:0;width:0;height:0;}
.tg .sw{width:32px;height:16px;border-radius:16px;background:var(--sw-off);position:relative;transition:background .15s;flex:none;}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s;}
.tg input:checked + .sw{background:var(--pri);}
.tg input:checked + .sw::after{transform:translateX(16px);}
.tg input:focus-visible + .sw{outline:2px solid var(--pri);outline-offset:2px;}
.swmini{width:32px;height:16px;border-radius:16px;background:var(--pri);position:relative;display:inline-block;}
.swmini::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff;}

/* 퍼널 다이어그램 */
.fdia{display:grid;grid-template-columns:210px 1fr;gap:20px;border:1px solid var(--line);background:var(--sub);border-radius:8px;padding:16px;margin-top:12px;}
@media (max-width:700px){.fdia{grid-template-columns:1fr;}}
.fdia .dl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:10px;}
.fstep{margin-bottom:10px;}
.fstep .t{font-size:12px;color:var(--ink-2);}
.fstep .bar{height:7px;border-radius:4px;background:var(--line-2);margin-top:4px;}
.fstep.a .bar{background:var(--pri);}
.fstep .n{font-size:11px;color:var(--pri);font-weight:600;font-variant-numeric:tabular-nums;}
.fnote{font-size:12px;color:var(--ink-3);line-height:1.6;}

/* 파라미터 테이블 */
table.pt{width:100%;border-collapse:separate;border-spacing:0 0;font-size:13px;margin-top:8px;}
table.pt th{text-align:left;font-size:13px;font-weight:400;color:var(--ink-2);padding:0 6px 8px;white-space:nowrap;}
table.pt th .rq{color:var(--red);margin-right:2px;}
table.pt td{padding:0 6px 10px;vertical-align:top;}
table.pt input,table.pt select{height:32px;font-size:13px;}
.drag{color:var(--ink-4);font-size:13px;padding-top:8px;}
.delx{color:var(--ink-4);font-size:15px;padding-top:6px;cursor:pointer;}

/* 드로어 992px */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;justify-content:flex-end;}
.drawer{background:var(--panel);width:100%;max-width:992px;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.14);}
.dh{padding:20px 24px 14px;}
.dh .row{display:flex;align-items:flex-start;}
.dh h3{font-size:16px;font-weight:500;color:var(--ink);margin:0;}
.dh .ms{font-size:13px;color:var(--ink-3);margin-top:3px;}
.dh .ms a{color:var(--pri);text-decoration:none;}
.dh .x{margin-left:auto;background:none;border:none;font-size:17px;color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 4px;}
.dh .x:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.db{padding:0 24px 16px;flex:1;overflow-y:auto;}
.df{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 18px;}

/* 우측 단말 */
.rail{border-left:1px solid var(--line);padding:16px 14px;background:var(--panel);position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow-y:auto;}
.railh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;}
.railh .dt{width:7px;height:7px;border-radius:50%;background:var(--green);}
.appsw{display:flex;gap:5px;margin-bottom:10px;}

/* ─── 실제 콘솔형 설정 센터 / 온보딩 카드 ─── */
.introflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
.ifstep{position:relative;padding:0 20px 0 42px;min-height:58px;}
.ifstep:not(:last-child)::after{content:"›";position:absolute;right:-5px;top:12px;color:var(--ink-4);font-size:24px;}
.ifnum{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:700;}
.ift{font-size:13px;font-weight:600;color:var(--ink);margin:2px 0 4px;}
.ifd{font-size:11.5px;line-height:1.45;color:var(--ink-3);}
.cfgcard{display:grid;grid-template-columns:46px 1fr auto;gap:13px;align-items:center;padding:17px 18px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;}
.cfgcard:hover{border-color:#BBC3FF;box-shadow:0 3px 12px rgba(55,72,180,.08);}
.cfgicon{width:42px;height:42px;border-radius:9px;background:#EAF7F3;color:#16836F;display:grid;place-items:center;font-weight:700;font-size:18px;}
.cfgcard .ct{font-size:14px;font-weight:600;color:var(--ink);}
.cfgcard .cd{font-size:12px;color:var(--ink-3);margin-top:5px;}
.tabsline{display:flex;gap:24px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;margin:-1px -1px 0;}
.tabsline button{border:0;background:none;padding:14px 2px 12px;color:var(--ink-3);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;}
.tabsline button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600;}
.twostep{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.guidebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:start;}
.guidebox .n{width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:12px;}
.guidebox b{font-size:13px}.guidebox p{font-size:11.8px;color:var(--ink-3);line-height:1.5;margin:4px 0 0;}

.readycard{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:11px 12px;min-height:72px;}
.readycard .rt{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}.readycard .rd{font-size:11.3px;line-height:1.45;color:var(--ink-3);}
.readycard .rs{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 7px;background:var(--pri-soft);color:var(--pri);}
.depflow{display:flex;align-items:stretch;gap:6px;margin:0 0 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;}
.depnode{min-width:112px;flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sub);font-size:11.5px;color:var(--ink-2);line-height:1.45;}
.depnode b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}.deparrow{align-self:center;color:var(--ink-4);font-size:17px;}
.life{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:11px 13px;border:1px solid var(--line);background:var(--sub);border-radius:8px;margin-bottom:14px;}
.life .ls{font-size:11.5px;border-radius:99px;padding:4px 9px;background:var(--panel);border:1px solid var(--line);color:var(--ink-3);}
.life .ls.on{background:var(--pri-soft);border-color:#C9D0FF;color:var(--pri);font-weight:700}.life .ar{color:var(--ink-4);}
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.gate .g{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sub)}.gate b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:4px}.gate span{font-size:11.3px;line-height:1.45;color:var(--ink-3);}
@media(max-width:1050px){.introflow{grid-template-columns:1fr 1fr;gap:18px}.ifstep:nth-child(2)::after{display:none}}
@media(max-width:900px){.readiness{grid-template-columns:1fr 1fr}.gate{grid-template-columns:1fr}.depflow{align-items:stretch}.deparrow{display:none}}

/* ─── 작업 생성 (전체화면 + 스테퍼) ─── */

.tcbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;flex:none;}
.tcbar .bk{background:none;border:none;font-size:17px;color:var(--ink-3);cursor:pointer;padding:2px 6px;}
.tcbar .kind{display:inline-flex;align-items:center;gap:6px;background:var(--pri-soft);color:var(--pri);font-size:13px;font-weight:600;border-radius:8px;padding:5px 11px;}

.stepper .sp{display:grid;grid-template-columns:16px 1fr;gap:11px;position:relative;padding-bottom:20px;}

.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px;}
.sec h3{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 16px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.tile{border:1px solid var(--line-2);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--panel);}
.tile:hover{border-color:var(--pri);}
.tile[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset;color:var(--ink);}
.tile .ti2{color:var(--ink-3);font-size:13px;}
.seg{display:inline-flex;background:var(--sub);border-radius:8px;padding:3px;gap:2px;}
.seg button{background:none;border:none;font-size:13.5px;color:var(--ink-3);border-radius:6px;padding:5px 14px;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.cond{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-top:11px;background:var(--sub);}
.cond .ch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);margin-bottom:8px;}
.cond .andt{font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-soft);border-radius:5px;padding:2px 7px;}
.estim{display:flex;align-items:center;gap:12px;margin-top:12px;}
.estim .ev{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
/* ─── 도움말 마커 & 오버레이 ─── */
.hm{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;
 border:1px solid var(--ink-4);color:var(--ink-4);font-size:9.5px;font-weight:700;font-style:normal;
 margin-left:5px;cursor:help;vertical-align:middle;flex:none;transition:.12s;line-height:1;user-select:none;}

 line-height:1.62;color:var(--ink-2);pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s;}

#helptip .hk.dev{color:var(--amber);} #helptip .hk.biz{color:var(--purple);}

"nav.l10n":["현지화","유저의 언어 속성에 맞춰 <b>버전별 문구를 자동 선택</b>해 발송합니다.","다국가 서비스일 때. 필리핀·말레이시아처럼 언어가 갈리는 시장에 특히 중요합니다.","유저 언어 속성이 수집되고 있어야 합니다.","언어별 문구를 작성합니다. 번역 품질이 성과에 직결되므로 현지 검수를 권장합니다."],

"chan.client":["클라이언트 채널","SDK가 받아 <b>앱 UI로 직접 렌더링</b>합니다. 앱을 실행 중인 유저에게만 닿습니다.","온보딩 안내, 이탈 방지 팝업, 상품 제안 등 앱 안에서의 개입.","메시지 타입별 렌더링 코드 구현이 필수입니다. 서버 개발은 없습니다.","어떤 화면·어떤 순간에 띄울지 시나리오를 설계합니다."],
"chan.third":["서드파티 플랫폼","위챗 구독 메시지·틱톡 게임 카드 등 <b>외부 플랫폼</b> 연동입니다.","해당 플랫폼에 서비스를 운영할 때만.","플랫폼별 SDK·계정 연동이 필요합니다.","해당 시장 진출 계획이 있을 때 검토합니다. 국내 SMS·알림톡은 여기 없고 Webhook으로 처리합니다."],
"prov.FCM":["FCM","구글의 푸시 인프라로 Android 잠금화면과 알림창에 도달합니다.","Android 유저에게 푸시할 때. 앱 밖의 이탈 유저를 호출하는 기본 채널입니다.","Firebase 서비스 계정 비공개 키 JSON과 FCM Registration Token 수집이 필요합니다. 서버 개발은 없고 AE가 FCM API를 직접 호출합니다.","Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키에서 JSON을 발급하고, 클릭 이벤트와 패스스루 처리 기준을 함께 정합니다."],
"prov.Aurora Mobile":["Aurora Mobile (极光推送)","중국 Android·Harmony 환경처럼 FCM을 사용할 수 없는 시장의 푸시 채널입니다.","중국 시장에 Android/Harmony 앱을 서비스할 때 사용합니다.","JPush SDK 연동, Registration ID 리포트, AppKey와 Master Secret 발급이 필요합니다. VIP 환경은 도달·클릭 단계가 자동 집계될 수 있습니다.","커스텀 퍼널을 쓰면 실제 수집 이벤트 이름을 등록하고, 패스스루 수신 로직도 함께 검증합니다."],
"prov.APNs":["APNs","Apple의 iOS 푸시 채널입니다. p12 인증서 또는 p8 계정 키를 사용합니다.","iOS 유저에게 푸시할 때 사용합니다.","p12는 앱·환경별이며 1년 갱신이 필요합니다. p8은 계정 내 앱에 공용이고 만료가 없어 권장됩니다. KeyID·TeamID·BundleID를 확보합니다.","AE iOS SDK의 푸시 자동 수집을 켜면 도달·클릭을 자동 매칭할 수 있습니다. 커스텀 방식은 클릭 이벤트 개발이 필요합니다."],
/* 공통 필드 */
"f.name":["채널 이름","운영자가 작업을 만들 때 <b>고르는 식별용 이름</b>입니다.","채널 생성 시 1회.","없음.","용도가 드러나게 짓습니다(예: <code>ingame-mail</code>). 나중에 개발용·플랫폼별 채널이 늘어납니다."],
"f.url":["URL","AE가 POST를 보낼 <b>자사 서버 주소</b>입니다. 플랫폼이 주는 값이 아닙니다.","Webhook 채널 생성 시. 서버 배포가 끝난 뒤 등록합니다.","엔드포인트를 만들고 배포한 뒤 <b>전체 주소를 회신</b>합니다. 경로는 자사 컨벤션대로 자유롭게.","서버팀에 '값을 알려달라'가 아니라 <b>개발 요청</b>을 해야 합니다. 만들어야 생기는 값입니다."],
"f.sendid":["전송 ID","<b>누구에게 보낼지</b> 식별하는 유저 속성입니다. payload의 <code>push_id</code>에 실립니다.","채널 생성 시. 채널 종류마다 적절한 속성이 다릅니다.","푸시면 토큰을, Webhook이면 서버가 조회 가능한 계정 ID를 <b>유저 속성으로 리포트</b>해야 합니다.","드롭다운이 비어 있으면 SDK 작업이 아직 안 된 것입니다. 개발 일정을 먼저 확인하세요."],
"f.verify":["채널 검증","시크릿 토큰을 이용한 <b>HmacSHA1 서명</b>으로 실제 AE 요청인지와 본문 변조 여부를 확인합니다.","운영 Webhook 채널은 항상 켜는 것을 권장합니다.","일반 암호화는 시크릿 키+요청 본문, 고급 암호화는 시크릿 키+타임스탬프+랜덤 문자열을 서명 재료로 사용합니다. 토큰은 환경변수나 시크릿 저장소에 보관합니다.","서버와 AE의 암호화 방식을 반드시 동일하게 맞춥니다. 고급 방식은 오래된 타임스탬프 요청을 거부해 재사용 공격을 막습니다."],
"f.crypt":["암호화 방식","일반은 <b>키+본문</b>으로 변조를 막고, 고급은 <b>키+타임스탬프+난수</b>로 탈취 후 재사용까지 막습니다. 두 방식 모두 가이드 기준 HmacSHA1을 사용합니다.","기본값(일반)으로 시작하고, 재사용 공격 방지가 필요하면 고급으로 전환합니다.","선택한 방식대로 헤더와 본문의 서명을 비교하고, 고급 방식은 허용 시간 범위를 추가 검증합니다.","서버팀과 합의 후 선택합니다. AE와 서버의 방식이 다르면 모든 요청이 거부됩니다."],
"f.funnel":["도달 퍼널 설정","발송이 <b>예약 → 실제 푸시 → 성공 → 실제 도달 → 클릭</b> 중 어디까지 갔는지 집계합니다.","운영 효과를 측정하려면 항상 켜세요. Webhook·클라이언트는 실제 도달과 클릭 이벤트를 직접 연결합니다.","실제 도달·클릭 이벤트를 리포트할 때 원본 요청의 <code>#ops_receipt_properties</code>를 이벤트 속성에 포함해야 같은 발송 건으로 매칭됩니다.","도달과 클릭 이벤트 이름을 트래킹 플랜·코드·채널 설정 세 곳에서 동일하게 유지합니다."],
"f.clickev":["푸시 클릭 이벤트명","4단계만 커스텀입니다. <b>앱이 실제로 올리는 이벤트 이름</b>을 적어야 연결됩니다.","도달 퍼널을 켤 때 함께.","알림 클릭 핸들러에서 이벤트를 리포트합니다. 이름은 사업팀과 사전 합의.","코드·채널 설정·트래킹 플랜 <b>세 곳의 이름이 모두 일치</b>해야 합니다. 오타 하나로 0건이 됩니다."],
"f.tpl":["컨텐츠 템플릿","운영자의 <b>입력 폼</b>이자 서버가 받을 <b>JSON 구조</b>입니다. 필드명이 곧 payload 키가 됩니다.","Webhook·클라이언트 채널 생성 시. 여기서 정한 필드가 개발 명세가 됩니다.","정의된 필드명 그대로 읽도록 구현합니다. 자동 매핑이 아니라 <b>이름 약속</b>입니다.","태스크마다 바뀌는 값만 필드로 만듭니다. 보상 코드는 기존 기획 데이터 체계를 그대로 씁니다."],
"f.custom":["커스텀 파라미터","화면에 보이지 않고 <b>시스템끼리 주고받는 값</b>입니다. 유저 속성을 자동으로 실어 보냅니다.","다중 서버 환경에서 서버 ID를 함께 보내는 등, 발송 대상을 명확히 특정해야 할 때.","해당 값을 읽어 라우팅·분기에 사용합니다.","어떤 부가 정보가 있어야 서버가 정확히 처리할 수 있는지 개발팀과 확인합니다."],
"f.pass":["패스스루 파라미터","알림에는 보이지 않고 <b>앱이 코드로 읽는</b> 부가 데이터입니다.","캠페인 식별, 특정 오브젝트 강조, 쿠폰 자동 적용 등. 화면 이동은 「방식」이 담당합니다.","값을 읽어 처리하는 코드가 없으면 무시됩니다. 키 이름을 사업팀과 합의합니다.","딥링크만 필요하면 「방식」으로 충분합니다. 처음엔 비워두고 시작해도 됩니다."],
"f.pkey":["서버 개인 키","AE가 구글 FCM API를 호출할 <b>발송 권한</b>입니다.","FCM 채널 생성 시 1회. 만료가 없어 재발급이 드뭅니다.","Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성.","앱 전체에 푸시를 보낼 수 있는 권한이므로 <b>파일을 메신저로 돌리지 마세요</b>."],
"f.mtype":["메시지 타입","앱 코드가 <b>이 값으로 분기</b>해 렌더링 방식을 결정합니다. <code>if (type=='popup')</code>","클라이언트 채널 생성 시. 팝업·배너·마퀴 등 표현 방식마다 값을 나눕니다.","타입별 렌더링 UI를 구현해야 합니다. 구현되지 않은 타입은 아무것도 표시되지 않습니다.","어떤 표현이 필요한지 기획하고 클라이언트팀과 타입 이름을 합의합니다."],
/* 태스크 */
"t.new":["작업 생성","실제 발송 단위를 만듭니다. 채널이 '배관'이면 작업은 <b>이번에 보낼 물건</b>입니다.","캠페인을 실행할 때마다.","트리거 발송이면 기준 이벤트가 수집되고 있어야 합니다.","목적 한 문장(누구에게·언제·무엇을·어떤 행동 유도)을 먼저 쓰고 시작하세요."],
"t.chan":["채널 선택","같은 문구라도 <b>채널에 따라 닿는 유저가 완전히 다릅니다</b>.","작업 생성 시 최초 선택. 나중에 바꾸면 입력 폼이 달라집니다.","각 채널이 요구하는 사전 작업이 다릅니다.","앱 밖 유저면 푸시, 앱 안이면 클라이언트, 보상 지급이면 Webhook으로 고릅니다."],
"t.lang":["기본 언어 / ＋","언어별 버전을 만들면 AE가 <b>유저의 언어 속성에 맞춰</b> 자동 선택합니다.","다국가 서비스일 때.","유저 언어 속성 수집이 선행돼야 합니다.","＋로 언어를 추가하고 각 버전을 작성합니다. 현지 검수를 거치는 편이 성과가 좋습니다."],
"t.attr":["유저 속성 삽입","문구에 닉네임·등급 같은 값을 넣으면 <b>유저마다 다른 문장</b>으로 치환돼 발송됩니다.","개인화가 성과에 영향을 주는 캠페인. 복귀 유도에 특히 효과적입니다.","해당 속성이 수집되고 있어야 합니다. 값이 비면 어색해지므로 기본값 정책을 정합니다.","치환값이 비었을 때의 대체 문구까지 함께 준비합니다."],
"t.title":["제목","알림창에서 <b>가장 먼저 읽히는 한 줄</b>입니다. 클릭률을 좌우합니다.","모든 푸시.","없음.","20자 초과 시 일부 기종에서 잘립니다. 핵심 단어를 앞쪽에 배치하세요."],
"t.body":["내용","제목을 보완해 <b>클릭할 이유</b>를 제시합니다.","모든 푸시.","없음.","50자 초과 시 일부 기기에서 잘립니다. 혜택·기한을 구체적으로 적는 편이 효과적입니다."],
"t.mode":["방식","알림을 탭했을 때 <b>어디로 보낼지</b> 결정합니다.","항상. 앱 홈만 열리면 유저가 직접 찾아야 해 이탈이 커집니다.","「지정 페이지 열기」를 쓰려면 딥링크 라우팅 구현이 필요합니다.","기획전·공지처럼 목적지가 하나면 「지정 페이지」, 유저마다 다르면 패스스루를 함께 씁니다."],
"t.thumb":["썸네일 이미지 URL","이미지가 붙은 알림은 <b>알림창에서 눈에 띕니다</b>.","시각적 소구가 중요한 프로모션.","이미지 호스팅과 HTTPS 접근이 필요합니다.","1MB 이내로 준비합니다. 기기별로 잘리는 비율이 달라 중앙에 핵심을 배치하세요."],
"t.export":["내보내기 대상","발송 대상 명단을 파일로 <b>사전 검증</b>하거나 외부 시스템에 넘길 때 씁니다.","대규모 발송 전 대상이 의도대로 잡혔는지 확인할 때.","외부 시스템 연동이 필요하면 수신 처리를 구현합니다.","개인정보가 포함되므로 반출 절차와 보관 정책을 확인한 뒤 사용합니다."],
/* 설정센터 */
"c.item":["설정 항목 ID","클라이언트 SDK가 <b>이 ID로 설정값을 조회</b>합니다.","설정 센터 도입 시 1회. 이후 변경하면 앱이 값을 못 찾습니다.","SDK 조회 코드에 동일한 ID를 넣습니다. <b>개발팀과 합의 필수</b>.","한 번 정하면 바꾸기 어려우므로 서비스 구조에 맞춰 신중히 명명합니다."],
"c.biztype":["비즈니스 타입","<b>설정 파일</b>은 JSON 하나를 통째로 관리하고, <b>독립 파라미터</b>는 필드 단위로 콘솔에서 바로 수정합니다.","자주 바뀌는 소수의 값이면 독립 파라미터, 대형 설정이면 파일 방식.","방식에 따라 파싱 코드가 달라집니다.","운영자가 콘솔에서 직접 바꿔야 하는 값이면 독립 파라미터가 편합니다."],
"c.param":["파라미터","앱이 읽는 <b>변수 하나하나</b>입니다. 파라미터 이름은 클라이언트·서버 변수명과 동일해야 합니다.","가격·문구·기능 스위치처럼 배포 없이 바꾸고 싶은 값.","동일한 이름으로 값을 읽는 코드를 구현합니다.","PM/운영팀이 파라미터 구조를 설계해 JSON으로 개발에 전달합니다."],
"c.chan":["컨피그 채널","설정값을 <b>어디로 배포할지</b> 정합니다. 운영 터치 채널과 이름은 같지만 용도가 다릅니다.","설정 센터로 값을 내려보낼 때.","Webhook이면 수신 처리, 클라이언트면 RemoteConfig SDK 연동이 필요합니다.","운영/테스트 환경이 분리돼 있으니 <b>테스트에서 먼저 검증</b>한 뒤 운영에 반영합니다."],
"c.aud":["타겟 오디언스","<b>어떤 유저에게</b> 이 설정을 적용할지 정합니다. 전체가 아니라 일부에만 적용할 수 있습니다.","A/B 테스트, 단계적 롤아웃, 등급별 차등 정책.","조건에 쓸 속성·이벤트가 수집되고 있어야 합니다.","신규 유저 5%에 먼저 적용해 보는 식으로 위험을 줄이며 확대합니다."],

 var LB=[["why","왜 필요"],["when","언제"],["dev","개발팀"],["biz","사업팀"]];
 function show(el){
  var h=HELP[el.getAttribute("data-h")];if(!h)return;

    return '<div class="hrow"><div class="hk '+l[0]+'">'+l[1]+'</div><div class="hv">'+h[i+1]+'</div></div>';}).join("");
  var r=el.getBoundingClientRect();tip.classList.add("on");
  var w=340,left=r.left+r.width/2-w/2;
  left=Math.max(10,Math.min(left,window.innerWidth-w-10));
  var th=tip.offsetHeight,top=r.bottom+9;
  if(top+th>window.innerHeight-8)top=Math.max(8,r.top-th-9);
  tip.style.left=left+"px";tip.style.top=top+"px";
 }

})();

var TOUR={on:false,list:null,key:null,i:0,motionTimers:[],manualDock:null,drag:null,resize:null,frame:0,floatPos:null,floatSize:null};
function clearTourMotion(){
 (TOUR.motionTimers||[]).forEach(function(t){clearTimeout(t);});
 TOUR.motionTimers=[];
 document.querySelectorAll(".tour-autofill,.tour-row-filling,.tour-demo-click").forEach(function(e){e.classList.remove("tour-autofill","tour-row-filling","tour-demo-click");});
}
function tourLater(fn,delay){var t=setTimeout(fn,delay);TOUR.motionTimers.push(t);return t;}
function tourSetInstant(sel,value){
 var e=document.querySelector(sel);if(e)e.value=value;
}
function tourType(sel,value,delay,speed){
 var e=document.querySelector(sel);if(!e)return;
 e.value="";e.classList.add("tour-autofill");
 var tick=speed||34;
 value.split("").forEach(function(_,i){
  tourLater(function(){
   if(!TOUR.on||!document.body.contains(e))return;
   e.value=value.slice(0,i+1);e.dispatchEvent(new Event("input",{bubbles:true}));
   if(i===value.length-1){e.classList.remove("tour-autofill");e.classList.add("tour-autofill-done");
    tourLater(function(){e.classList.remove("tour-autofill-done");},700);}
  },(delay||0)+i*tick);
 });
}
function tourChoose(sel,index,delay){
 var e=document.querySelector(sel);if(!e)return;
 tourLater(function(){if(!TOUR.on||!document.body.contains(e))return;e.selectedIndex=index;e.dispatchEvent(new Event("change",{bubbles:true}));
  e.classList.add("tour-autofill-done");tourLater(function(){e.classList.remove("tour-autofill-done");},700);},delay||350);
}
function tourToggle(sel,delay){
 var e=document.querySelector(sel);if(!e)return;
 tourLater(function(){if(!TOUR.on||!document.body.contains(e))return;e.click();var row=e.closest(".tg");if(row){row.classList.add("tour-row-filling");tourLater(function(){row.classList.remove("tour-row-filling");},800);}},delay||350);
}

  if(pfunnel){pfunnel.checked=pi>7;document.getElementById("d-fn").classList.toggle("hidden",pi<=7);}
 }
 if(TOUR.key==="client"&&st.drawer==="cl"){
  var ci=TOUR.i,cname="checkout-popup",csid=document.querySelector("#d-sid"),cfunnel=document.querySelector('[onchange*="d-fn"]');

  '<div class="tour-scroll"><div class="tour-route"><b>현재 화면</b><span class="arr">›</span><span>'+tourRouteLabel(st)+'</span></div>'+
  '<h4>'+st.t+'</h4>'+
  '<div class="tour-one-line"><b>핵심 역할</b><span>'+tourOneLineText(st,beginner)+'</span></div>'+
  '<div class="tour-beginner"><div><div class="bk">이 기능의 핵심 역할</div><div class="bv">'+beginner.plain+'</div></div></div>'+
  '<div class="tour-team"><div class="dev"><b>개발팀</b><span>'+(st.dev||"별도 확인 사항이 없습니다.")+'</span></div><div class="biz"><b>사업팀</b><span>'+(st.biz||"별도 결정 사항이 없습니다.")+'</span></div></div>'+
  '</div>'+
  '<div class="tfoot"><div class="prog"><span style="width:'+pct+'%"></span></div><div class="tbtns">'+
  (TOUR.i>0?'<button class="btn btn-def" onclick="tourPrev()">이전</button>':'')+
  '<button class="btn btn-pri" onclick="tourNext()">'+(TOUR.i===TOUR.list.length-1?(st.submitDemo?"작업 제출 완료":"가이드 완료"):"다음")+'</button></div><div class="tnum">진행 '+pct+'%</div></div>'+
  '<div class="tour-resize-handle" onpointerdown="startTourResize(event)" aria-label="가이드 크기 조절"></div>';
 /* 설명 카드는 고정하고 실제 화면·강조 영역만 움직여 방향 감각을 유지합니다. */
 if(dockBottom){
  cd.style.top="auto";cd.style.bottom="0";cd.style.left="0";cd.style.right="0";cd.style.borderLeft="0";cd.style.borderRight="0";
  if(isFloating&&TOUR.floatPos){
   if(TOUR.floatSize)setTourFloatSize(TOUR.floatSize.w,TOUR.floatSize.h);
   setTourFloatPosition(TOUR.floatPos.x,TOUR.floatPos.y);
  }
 }else{
  cd.style.top="0";cd.style.bottom="0";
  if(dockLeft){cd.style.left="0";cd.style.right="auto";cd.style.borderLeft="0";cd.style.borderRight="1px solid #E3E6EE";}
  else{cd.style.left="auto";cd.style.right="0";cd.style.borderLeft="1px solid #E3E6EE";cd.style.borderRight="0";}
 }
 requestAnimationFrame(updateTourSizeMode);
}
document.addEventListener("keydown",function(e){
 if(!TOUR.on)return;
 if(e.key==="Enter"){e.preventDefault();tourNext();}
 else if(e.key==="Escape"){e.preventDefault();endTour();}
 else if(e.key==="ArrowLeft")tourPrev();
 else if(e.key==="ArrowRight")tourNext();
});
window.addEventListener("resize",function(){if(TOUR.on)paintStep(TOUR.list[TOUR.i]);});

paintTop();setSection("engage");log("콘솔 로드 — 실측 디자인 토큰 적용","hi");phone();
</script>

</body>
